<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <text x="30" y="28" font-size="15" fill="currentColor" opacity="0.75">The compromise envelope: pick two, apologize for the third</text>
